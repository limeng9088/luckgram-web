# Luckgram Web relay on your own server (luckgram-specs#138, W2) — the same rules as the Worker
# (relay/src/rules.js): only /<dc>[-1]/apiws[_premium] with dc 1–5, only from Luckgram Web's
# origins, WebSocket only, nothing logged.
#
# Put this in the http {} block. Replace relay.example.com and the certificate paths.

map $http_upgrade $lg_connection_upgrade {
    default   upgrade;
    ''        close;
}

# 1 for an Origin that may use the relay
map $http_origin $lg_origin_allowed {
    default                                               0;
    "https://web.luckgram.cc"                             1;
    "https://web-dev.luckgram.cc"                         1;
    "https://lgweb.cat158.com"                            1;
    "~^https://[a-z0-9-]+\.luckgram-web-dev\.pages\.dev$" 1;
    "~^https://[a-z0-9-]+\.luckgram-web\.pages\.dev$"     1;
}

server {
    listen 443 ssl;
    http2 on;
    server_name relay.example.com;

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;

    # no IP addresses, no requests: nothing is written about a connection
    access_log off;
    error_log  /var/log/nginx/luckgram-relay.error.log crit;

    # Telegram's names are resolved when a connection is made, not once at start
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    location ~ "^/(?<lg_dc>[1-5])(?<lg_media>-1)?/(?<lg_path>apiws|apiws_premium)$" {
        if ($request_method != GET)      { return 404; }
        if ($lg_origin_allowed = 0)      { return 403; }
        if ($http_upgrade != "websocket") { return 426; }

        proxy_pass https://kws$lg_dc$lg_media.web.telegram.org/$lg_path;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host kws$lg_dc$lg_media.web.telegram.org;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lg_connection_upgrade;
        # Telegram is told nothing about who connects
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";

        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        return 404;
    }
}
