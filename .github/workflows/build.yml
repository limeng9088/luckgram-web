name: Build

# Luckgram Web (luckgram-specs#137, W1). Every push to master, every pull request and a manual run:
# upstream's tests, the type check and `vite build`, then the site is put together and deployed to
# Cloudflare Pages project luckgram-web-dev —
#   master       → its production branch, https://web-dev.luckgram.cc
#   pull request → a preview, https://<branch>.luckgram-web-dev.pages.dev, linked in a PR comment
# The production address (web.luckgram.cc) is deployed only by release.yml, by hand.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LUCKGRAM_CHANNEL: dev
  LUCKGRAM_BUILD: ${{ github.run_number }}
  LUCKGRAM_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  # * the development site's Pages project: the repository variable LUCKGRAM_DEV_PAGES_PROJECT when it is set
  # * (Settings → Secrets and variables → Actions → Variables), so that the site can move without a commit (specs#167)
  PAGES_PROJECT: ${{ vars.LUCKGRAM_DEV_PAGES_PROJECT || 'luckgram-web-dev' }}
  LUCKGRAM_DEV_ORIGIN: ${{ vars.LUCKGRAM_DEV_ORIGIN || format('https://{0}.pages.dev/', vars.LUCKGRAM_DEV_PAGES_PROJECT || 'luckgram-web-dev') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Telegram API credentials are configured
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::The repository secrets TG_API_ID and TG_API_HASH are not set (Settings → Secrets and variables → Actions). A Luckgram build never falls back to the credentials upstream keeps in .env."
            exit 1
          fi

      # * the version of pnpm is package.json's `packageManager`, the version of Node its `engines`
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test, type check and build
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: pnpm build

      - name: Assemble and check the site
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          node scripts/luckgram/assemble.mjs
          node scripts/luckgram/check-site.mjs

      - name: Deploy to Cloudflare Pages (the development project)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: bash scripts/luckgram/deploy.sh "$PAGES_PROJECT" tmp/luckgram-site

      - name: Link the preview in the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ steps.deploy.outputs.alias }}
        run: |
          MARK='<!-- luckgram-preview -->'
          BODY=$(printf '%s\n预览（Preview）：%s\n本次提交（this commit）：%s · `%s` · build %s\n' "$MARK" "${ALIAS:-$URL}" "$URL" "${LUCKGRAM_COMMIT:0:7}" "$LUCKGRAM_BUILD")
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- luckgram-preview -->")) | .id' | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$BODY" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" > /dev/null
          fi
