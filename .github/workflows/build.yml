name: Build

# Luckgram Web (luckgram-specs#137, W1). Every pull request and a manual run: upstream's tests, the
# type check and `vite build`, then the site is put together and checked — as the production site
# it would be, since that is where a merge takes it (release.yml). Nothing is deployed from here:
# there is no development site and there are no previews (luckgram-specs#167).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # * what is built and checked is what a merge releases
  LUCKGRAM_CHANNEL: prod
  LUCKGRAM_BUILD: ${{ github.run_number }}
  LUCKGRAM_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Telegram API credentials are configured
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::The repository secrets TG_API_ID and TG_API_HASH are not set (Settings → Secrets and variables → Actions). A Luckgram build never falls back to the credentials upstream keeps in .env."
            exit 1
          fi

      # * the version of pnpm is package.json's `packageManager`, the version of Node its `engines`
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test, type check and build
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: pnpm build

      - name: Assemble and check the site
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          node scripts/luckgram/assemble.mjs
          node scripts/luckgram/check-site.mjs

      # * There is no development site and no preview (luckgram-specs#167): the site of a pull request is
      # * tried on the tester's own computer. The artifact is the site exactly as a merge would release it,
      # * and the script that serves it (README.md, "Trying a pull request"). It holds nothing the public
      # * site does not: the build's api_id / api_hash are in every Telegram client's scripts.
      - name: Put the site and its server together
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p tmp/luckgram-artifact
          mv tmp/luckgram-site tmp/luckgram-artifact/site
          cp scripts/luckgram/serve.mjs tmp/luckgram-artifact/serve.mjs

      - name: Upload the site (3 days)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: luckgram-web-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: tmp/luckgram-artifact
          retention-days: 3
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error
