name: Release

# Luckgram Web (luckgram-specs#137, W1). The production address — https://web.luckgram.cc and the
# backup entrance https://lgweb.cat158.com, both on Cloudflare Pages project luckgram-web — is
# deployed only from here, by hand, from a commit of master.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit of master to release (full SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  LUCKGRAM_CHANNEL: prod
  LUCKGRAM_BUILD: ${{ github.run_number }}
  PAGES_PROJECT: luckgram-web

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: The commit is on master
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          SHA=$(git rev-parse HEAD)
          if [ "$SHA" != "$COMMIT" ]; then
            echo "::error::Give the full SHA of the commit ($COMMIT resolved to $SHA)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::$SHA is not on master; only merged commits are released."
            exit 1
          fi
          echo "LUCKGRAM_COMMIT=$SHA" >> "$GITHUB_ENV"

      - name: Telegram API credentials are configured
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::The repository secrets TG_API_ID and TG_API_HASH are not set."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test, type check and build
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: pnpm build

      - name: Assemble and check the site
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          node scripts/luckgram/assemble.mjs
          node scripts/luckgram/check-site.mjs

      - name: Deploy to Cloudflare Pages (luckgram-web)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: release
        run: bash scripts/luckgram/deploy.sh "$PAGES_PROJECT" tmp/luckgram-site
